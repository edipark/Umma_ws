# SLAM Toolbox — online asynchronous mode
slam_toolbox:
  ros__parameters:
    # ── Plugin ──
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── General ──
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping    # mapping | localization

    # ── QoS (중요) ──
    # LiDAR 드라이버가 BEST_EFFORT로 /scan 을 publish 하는 경우가 많습니다.
    # 구독자가 RELIABLE을 요구하면 "/scan QoS incompatible" 경고와 함께 스캔을 못 받습니다.
    scan_qos_history: keep_last
    scan_qos_reliability: best_effort
    scan_qos_durability: volatile

    # ── Map update ──
    map_update_interval: 5.0            # seconds
    resolution: 0.05                     # metres per cell
    min_laser_range: 0.1                 # must be >= LiDAR range_min (YDLidar G2B = 0.1 m)
    max_laser_range: 16.0                # clip laser readings beyond this
    minimum_time_interval: 0.5
    transform_timeout: 1.0               # TF lookup 여유 (Jetson/Tegra 에서는 0.2 가 짧음)
    tf_buffer_duration: 30.0

    # async 모드에서는 scan queue가 쌓이면 바로 "queue full" 드랍으로 이어지기 쉬워서 1 권장
    scan_queue_size: 1

    # ── Scan matching ──
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3        # metres before a new scan is added
    minimum_travel_heading: 0.3         # radians before a new scan is added
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0

    # ── Loop closure ──
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Correlation / search ──
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Performance ──
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349   # ~0.2 deg
    coarse_search_angle_offset: 0.349   # ~20 deg
    coarse_angle_resolution: 0.0349     # ~2 deg
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ── Misc ──
    debug_logging: false
    throttle_scans: 1
    enable_interactive_mode: true
    use_lifecycle_manager: false
    use_sim_time: false

    # ── Map file (for serialization / deserialization) ──
    # map_file_name: ""
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    stack_size_to_use: 40000000
