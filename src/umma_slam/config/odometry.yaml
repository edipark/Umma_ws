# ============================================================================
#  Odometry node 전용 설정
# ============================================================================
#  로봇 기구 파라미터 (wheel_radius / wheel_base / wheel_offset_x) 는
#  config/robot_params.yaml 에서 공통으로 주입되므로 이 파일에서 절대 중복 정의하지 마세요.
#  여기는 odom 노드 고유의 프레임/퍼블리시 설정만 둡니다.
