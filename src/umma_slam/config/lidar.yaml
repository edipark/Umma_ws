# YDLidar parameters — copy/adjust for your specific model
# This file is used by the bringup launch to configure the LiDAR.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    sample_rate: 5
    abnormal_check_count: 4
    # slam_toolbox 는 scan 의 포인트 수가 **매번 동일** 해야 등록/매칭을 합니다.
    # false 로 두면 매 scan 마다 point 수가 다르게 들어와서
    #   "LaserRangeScan contains N range readings, expected M" 경고와 함께
    #   매 scan 이 drop 되어 맵이 업데이트되지 않습니다. 반드시 true.
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: true
    intensity_bit: 10
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 16.0
    range_min: 0.1
    frequency: 10.0
    invalid_range_is_inf: false
